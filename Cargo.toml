[package]
# Fork of `async-gcode` (https://github.com/ithinuel/async-gcode) maintained for Printhor. It is
# published under its own name, as `async-gcode` on crates.io belongs to the upstream project. The
# library keeps its `async_gcode` name: depend on it as
# `async-gcode = { package = "printhor-async-gcode", version = "0.4.0" }`
name = "printhor-async-gcode"
version = "0.4.0"
authors = ["Wilfried Chauveau <wilfried.chauveau@ithinuel.me>", "Carlos Barrales Ruiz <cbruiz@gmail.com>"]
description = "An async gcode parser for no_std targets (Printhor fork of async-gcode)."
keywords = ["async", "await", "gcode"]
license = "MIT"
edition = "2024"
repository = "https://github.com/cbruiz/async-gcode"
documentation = "https://docs.rs/printhor-async-gcode"
categories = ["asynchronous", "embedded", "no-std", "parsing"]

[lib]
name = "async_gcode"

[features]
default = ["std", "future-stream"]
std = ["float-f64"]
parse-comments = []
parse-trailing-comment = []
parse-checksum = []
parse-parameters = ["dep:either"]
parse-expressions = ["dep:either"]
optional-value = []
string-value = []
float-f64 = []
# Use future::stream as input interface. If not set, async-traits will be used insted.
future-stream = ["pin-project-lite", "futures"]

[badges]
maintenance = { status = "experimental" }

[dev-dependencies]
futures-executor = { version = "0.3" }

[[example]]
name = "cli"
required-features = ["std", "future-stream"]

[dependencies]
either = { version = "^1", default-features = false, optional = true }
futures = { version = "0.3", optional = true, default-features = false }
pin-project-lite = { version = "0.2", optional = true }